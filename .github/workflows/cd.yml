name: CD

on:
  push:
    branches: [main, master]
    tags: ["v*"]

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  build-and-push:
    name: 构建并推送镜像
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 生成镜像标签
        id: meta
        run: |
          echo "tag=$(echo ${GITHUB_SHA::8})" >> "$GITHUB_OUTPUT"
      - name: 构建后端镜像
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/pmc-backend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/pmc-backend:${{ steps.meta.outputs.tag }}
      - name: 构建前端镜像
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/pmc-frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/pmc-frontend:${{ steps.meta.outputs.tag }}

  deploy:
    name: 部署到服务器（示例）
    runs-on: ubuntu-latest
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: 同步配置到服务器并部署
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "docker-compose.yml,.env.example"
          target: "/opt/pmc-manager"
      - name: 远程执行部署
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/pmc-manager
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
